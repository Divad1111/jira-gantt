name: Build Jira P2 plugin
on:
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '补发已有版本标签，例如 v1.3.4；留空则按所选分支/标签构建'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plugin.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Resolve plugin version from release tag
        id: plugin
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          namespace = 'http://maven.apache.org/POM/4.0.0'
          tree = ET.parse('pom.xml')
          root = tree.getroot()
          node = root.find('{' + namespace + '}version')
          base_version = node.text if node is not None else ''
          tag = os.environ.get('RELEASE_TAG', '')
          version = tag[1:] if tag.startswith('v') else tag or base_version
          pattern = r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?'
          if not version or not re.fullmatch(pattern, version):
              raise SystemExit(f'Invalid version: tag={tag!r}, pom.xml={base_version!r}; expected 1.3.4 or v1.3.4')
          if tag and version.upper().endswith('-SNAPSHOT'):
              raise SystemExit(f'SNAPSHOT tags cannot be published: {tag}')
          if node is None:
              raise SystemExit('pom.xml is missing a project version')
          if tag:
              # Only modify the checked-out runner workspace, never the repository's tag.
              node.text = version
              ET.register_namespace('', namespace)
              ET.register_namespace('xsi', 'http://www.w3.org/2001/XMLSchema-instance')
              tree.write('pom.xml', encoding='UTF-8', xml_declaration=True)
          print(f'Release tag: {tag or "(none)"}; base version: {base_version}; build version: {version}')
          jar = f'target/filter-gantt-gadget-{version}.jar'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PLUGIN_JAR={jar}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release_tag={tag}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -ntp -DskipTests=false clean package
      - name: Verify installable plugin JAR
        run: ./scripts/verify-package.ps1 -JarPath $env:PLUGIN_JAR
        shell: pwsh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp "$PLUGIN_JAR" release-assets/
          cd release-assets
          sha256sum *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: filter-gantt-gadget
          path: release-assets/
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            frontend/test-results/
          if-no-files-found: ignore

  release:
    needs: build
    if: needs.build.outputs.release_tag != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filter-gantt-gadget
          path: release-assets
      - name: Create release or attach missing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json assets > release.json; then
            for asset in *.jar SHA256SUMS.txt; do
              if ! jq -e --arg name "$asset" '.assets | any(.name == $name)' release.json > /dev/null; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" *.jar SHA256SUMS.txt \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
